{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{% static 'img/asu-logo.jpg' %}">

    <title>EduPath - Login</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Auth CSS -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body class="auth-body">

    <main class="landing-card">

        <img
            src="{% static 'img/asu-logo.jpg' %}"
            alt="Aklan State University Logo"
            class="logo"
        >

        <h1 class="title">EduPath</h1>

        <p class="subtitle">
            Sign in to your account
        </p>

        {% if is_locked %}
        <div class="error-card lock-card" style="background-color: #fef2f2; border: 1px solid #f87171; border-left: 4px solid #dc2626;">
            <i class="fas fa-user-lock error-card-icon" style="color: #dc2626; font-size: 16px;"></i>
            <span class="error-card-text" style="color: #991b1b; font-weight: 500;">{{ error }}</span>
        </div>
        {% elif error %}
        <div class="error-card">
            <i class="fas fa-exclamation-circle error-card-icon"></i>
            <span class="error-card-text">{{ error }}</span>
        </div>
        {% endif %}

        {% if success %}
        <div class="success-card">
            <i class="fas fa-circle-check success-card-icon"></i>
            <span class="success-card-text">{{ success }}</span>
        </div>
        {% endif %}

        <form action="{% url 'signin' %}" method="POST" class="login-form">
            {% csrf_token %}

            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="login_id" name="login_id" placeholder="Enter your LRN, Username, or Email" value="{{ login_id|default:'' }}" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <div class="remember-row">
                <label class="remember-label">
                    <input type="checkbox" id="rememberMe" name="rememberMe"> Remember me
                </label>
                <a href="{% url 'forgot_password' %}" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In
            </button>
        </form>

        <p class="card-footer-link">
            Don't have an account? <a href="{% url 'signup' %}">Register</a>
        </p>

    </main>

    <footer class="footer">
        © 2026 EduPath System. All rights reserved.
    </footer>

</body>
</html>
