{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | {{ site_title|default:_('Django site admin') }}{% endblock %}

{% block branding %}
<div id="site-name" style="display: flex; align-items: center; gap: 10px; margin: 5px 0;">
    <img src="{% static 'img/edupath-icon.png' %}" alt="EduPath Logo" style="height: 30px; width: auto; vertical-align: middle;">
    <span style="font-weight: bold; font-family: 'Inter', sans-serif; font-size: 1.2rem; color: #f5f7fa;">{{ site_header|default:_('EduPath Administration') }}</span>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}
