{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{% static 'img/asu-logo.jpg' %}">

    <title>EduPath - Course Recommendation System</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Auth CSS -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body class="auth-body">

    <main class="landing-card">

        <img
            src="static/img/asu-logo.jpg"
            alt="Aklan State University Logo"
            class="logo"
        >

        <h1 class="title">EduPath</h1>

        <p class="subtitle">
            Course Recommendation System
        </p>

        <p class="description">
            Discover the best courses suited for your interests and
            skills. Plan your future career path with us.
        </p>

        <div class="buttons">

            <a href="{% url 'signin' %}" class="btn btn-login">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login
            </a>

            <a href="{% url 'signup' %}" class="btn btn-register">
                <i class="fa-solid fa-user-plus"></i>
                <u>Register</u>
            </a>

        </div>

    </main>

    <footer class="footer">
        © 2026 EduPath System. All rights reserved.
    </footer>

</body>
</html>
